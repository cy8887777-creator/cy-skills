<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>走查靶站 · 故意埋缺陷</title>
<style>
  body{font-family:sans-serif;margin:0;padding:12px;background:#fff}
  .wide{width:520px;height:40px;background:#eef}          /* 缺陷：390 视口横向溢出 */
  .faint{color:#cccccc;font-size:14px}                     /* 缺陷：对比度不足 */
  .tiny{height:14px;padding:0;font-size:10px}              /* 缺陷：按钮过小 + 字号过小 */
  .badge-warn{color:#FF7B28;background:rgba(255,123,40,.12);font-size:12px}
  .stack{position:relative;height:60px}
  .stack .cover{position:absolute;top:0;left:0;width:200px;height:40px;background:#fff;z-index:9999}
</style>
</head>
<body>
  <h1>靶站</h1>
  <div class="wide">固定 520px 宽块（390 视口必溢出）</div>
  <p class="faint">这段浅灰文字对比度不足</p>
  <div class="stack">
    <p class="label">被压住的说明文字</p>
    <div class="cover">白色盖板（z-index:9999 魔法值）</div>
  </div>
  <button class="tiny">小按钮</button>
  <span class="badge-warn">进行中</span>
  <form>
    <input placeholder="只有 placeholder 的输入框">
    <button type="submit">提交</button>
  </form>
  <img src="not-exist.png">
</body>
</html>
